name: tts
# Records the app's voice (Hindi, Odia, English) with Sarvam AI. Run it by hand from the Actions tab.
# Needs the repository secret SARVAM_API_KEY (Settings → Secrets and variables → Actions).
#   mode "sample": a few sentences in each voice, offered on the run page as "tts-voice-samples"
#                  (open index.html inside to compare). Nothing is committed.
#   mode "full":   everything still missing, in one voice; committed, then the site is republished.
# The work is done by wildarc-sutra's shared workflow; this file only says what is particular to LETS.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: sample = try voices · full = record everything and publish
        type: choice
        options: [sample, full]
        default: sample
      speakers:
        description: 'sample: voices to try, comma-separated'
        default: ritu,kavya,roopa,gokul
      speaker:
        description: 'full: the one voice to use'
        default: ritu
      pace:
        description: Speaking pace (0.5 to 2.0, 1.0 = normal)
        default: '0.9'
      force:
        description: 'full: record again what already exists'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  tts:
    uses: yozo06/wildarc-sutra/.github/workflows/tts.yml@main
    with:
      mode: ${{ inputs.mode }}
      speakers: ${{ inputs.speakers }}
      speaker: ${{ inputs.speaker }}
      pace: ${{ inputs.pace }}
      force: ${{ inputs.force }}
      sentences: node scripts/sentences.mjs
      default-pack: sarvam
      after: npm run sw && npm run check
      commit: app/sw.js
      publish: pages.yml
    secrets:
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
